[project]
name = "neuroctivity"
version = "0.1.0"
description = "Neuroctivity API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neuroctivity"
module-root = "backend/src"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "import-linter>=2.17",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
    "uvicorn>=0.54.0",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend/src", "backend/tests", "api"]
extend-exclude = ["node_modules", ".next", "public"]

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["PLR1702"]
preview = true
explicit-preview-rules = true
ignore = [
    "D",
    "CPY",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "PLR2004"]
"api/*.py" = ["INP001"]
"!backend/src/neuroctivity/domain/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Domain code must receive the clock as an argument."
"datetime.datetime.utcnow".msg = "Domain code must receive the clock as an argument."
"datetime.datetime.today".msg = "Domain code must receive the clock as an argument."
"datetime.date.today".msg = "Domain code must receive the clock as an argument."
"uuid.uuid1".msg = "Domain code must receive ids as arguments."
"uuid.uuid4".msg = "Domain code must receive ids as arguments."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40
max-nested-blocks = 4

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src:backend"
files = ["backend/src", "backend/tests", "api"]
explicit_package_bases = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "neuroctivity"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: entrypoint -> transport | infrastructure -> application -> domain"
type = "layers"
layers = [
    "neuroctivity.openapi_export",
    "neuroctivity.main",
    "neuroctivity.config",
    "neuroctivity.transport | neuroctivity.infrastructure",
    "neuroctivity.application",
    "neuroctivity.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of I/O, HTTP and SDK types"
type = "forbidden"
source_modules = ["neuroctivity.domain", "neuroctivity.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx",
    "httpx2",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, clock, randomness, serialisation or schema types"
type = "forbidden"
source_modules = ["neuroctivity.domain"]
forbidden_modules = [
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "httpx",
    "httpx2",
    "asyncio",
    "concurrent",
    "http",
    "io",
    "json",
    "logging",
    "os",
    "pathlib",
    "random",
    "secrets",
    "shutil",
    "socket",
    "sqlite3",
    "ssl",
    "subprocess",
    "tempfile",
    "threading",
    "time",
]

[tool.vulture]
paths = ["backend/src", "backend/vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = ["@router.*"]
ignore_names = ["model_config", "create_app"]

[tool.coverage.run]
source = ["neuroctivity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
