name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  frontend:
    name: Frontend (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No JavaScript in source (TypeScript-only rule)
        run: |
          matches=$(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs' ':!:public/**')
          if [ -n "$matches" ]; then
            echo "::error::JavaScript files found in source. This repo is TypeScript-only."
            echo "$matches"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (FSD boundaries + strict TS + complexity)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Generated API types match the committed OpenAPI schema
        run: pnpm api:check

      - name: Test (public surface, legacy URLs, atlas checksum)
        run: pnpm test

      - name: Build (fails if any route becomes dynamic)
        run: pnpm build

  backend:
    name: Backend (format, lint, mypy strict, import-linter, dead code, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: make install

      - name: Check (suppression guard + OpenAPI drift + format + lint incl. complexity budget + mypy strict + import-linter + dead code)
        run: make check

      - name: Test (starts the coverage data)
        run: make test

      - name: Coverage floors (overall, domain + application, adapters)
        run: make coverage-gate

  backend-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit locked dependencies for known vulnerabilities
        run: make audit

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the repository history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'
